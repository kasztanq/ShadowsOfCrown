<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cienie Korony - Bezlitosny Dwór</title>
<style>
  :root {
    --bg-dark: #120e0c;
    --parchment: #e8dcb8;
    --parchment-dark: #c4b07e;
    --ink: #241a12;
    --gold: #f5c542;
    --crimson: #8f1d1d;
    --danger: #ff4d4d;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    font-family: 'Georgia', serif;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #080605;
    color: var(--parchment);
    overflow: hidden;
  }

  #game-frame {
    width: 100vw;
    height: 100dvh;
    background: radial-gradient(circle at center, #2b2019 0%, var(--bg-dark) 75%, #070504 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  #bg-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .ui-layer {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    justify-content: space-between;
    align-items: center;
  }

  .header-wrapper {
    width: 100%;
    background: rgba(12, 9, 8, 0.9);
    border-bottom: 2px solid #3a2e25;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-hud {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 20px 6px 20px;
  }

  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: clamp(0.9rem, 1.4vw, 1.15rem);
    font-weight: bold;
    color: var(--gold);
  }

  .rank-banner {
    font-size: clamp(0.76rem, 1.1vw, 0.95rem);
    color: #d9c89e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(58, 46, 37, 0.45);
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid #4a3c31;
    flex-wrap: wrap;
    gap: 8px;
  }

  .upkeep-warning {
    color: #e67e22;
    font-size: 0.75rem;
  }

  .hud-stats { display: flex; gap: clamp(12px, 2.5vw, 24px); }
  .hud-controls { display: flex; gap: 8px; }

  .icon-btn {
    background: #261f1a;
    border: 1px solid #4a3c31;
    color: var(--parchment);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: clamp(0.82rem, 1.1vw, 1rem);
    transition: border-color 0.2s, background 0.2s;
  }

  .icon-btn:hover { border-color: var(--gold); background: #332922; }

  /* Cztery wskaźniki stanu */
  .meters-panel {
    width: 100%;
    max-width: 1100px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(10px, 2.2vw, 22px);
    padding: 6px 20px 12px 20px;
  }

  .meter {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: clamp(0.75rem, 1.1vw, 0.95rem);
  }

  .meter-label {
    margin-bottom: 5px;
    color: #d1c4a5;
    font-weight: bold;
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .bar-bg {
    width: 100%;
    height: clamp(10px, 1.4vh, 14px);
    background: #2b231d;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid #4a3c31;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    width: 50%;
    transition: width 0.4s ease-out;
  }

  #bar-king { background: #9b59b6; }
  #bar-church { background: #f1c40f; }
  #bar-nobility { background: #e74c3c; }
  #bar-suspicion { background: #c0392b; }

  .danger-zone {
    border-color: var(--danger) !important;
    box-shadow: 0 0 8px rgba(255, 77, 77, 0.75);
  }

  .pulse-up { box-shadow: 0 0 12px #2ecc71; transform: scale(1.06); }
  .pulse-down { box-shadow: 0 0 12px #e74c3c; transform: scale(1.06); }

  /* Karta Dylematu */
  .card-viewport {
    flex: 1;
    width: 100%;
    max-width: 880px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: clamp(8px, 2vh, 22px) 20px;
    position: relative;
    min-height: 0;
  }

  #event-card {
    background: linear-gradient(145deg, var(--parchment), var(--parchment-dark));
    color: var(--ink);
    width: 100%;
    height: 100%;
    max-height: 410px;
    padding: clamp(16px, 3vh, 32px) clamp(18px, 4vw, 42px);
    border-radius: 12px;
    border: 4px double #594433;
    box-shadow: 0 18px 45px rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.28s;
    overflow-y: auto;
    position: relative;
  }

  .card-hidden {
    opacity: 0;
    transform: translateY(35px) scale(0.96);
  }

  .book-badge {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: rgba(58, 46, 37, 0.14);
    color: #4a3525;
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid rgba(89, 68, 51, 0.35);
    margin-bottom: 8px;
    font-weight: bold;
  }

  .portrait-circle {
    width: clamp(58px, 8vh, 84px);
    height: clamp(58px, 8vh, 84px);
    border-radius: 50%;
    background: #3a2e25;
    border: 3px solid #594433;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(1.7rem, 3.6vh, 2.5rem);
    margin-bottom: 10px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    flex-shrink: 0;
  }

  #speaker-name {
    font-size: clamp(1.1rem, 1.9vw, 1.45rem);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--crimson);
    margin-bottom: 2px;
  }

  #event-title {
    font-size: clamp(0.84rem, 1.2vw, 1rem);
    font-style: italic;
    color: #594433;
    margin-bottom: clamp(8px, 1.8vh, 14px);
  }

  #event-desc {
    font-size: clamp(0.94rem, 1.5vw, 1.18rem);
    line-height: 1.48;
    max-width: 700px;
  }

  /* Przyciski decyzji */
  .choices-container {
    width: 100%;
    max-width: 880px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 9px;
    padding: 0 20px clamp(10px, 1.8vh, 18px) 20px;
  }

  @media (min-width: 768px) {
    .choices-container {
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
    }
  }

  .choice-btn {
    background: rgba(43, 34, 27, 0.95);
    color: var(--parchment);
    border: 1px solid #5c4838;
    padding: clamp(10px, 1.6vh, 15px) 15px;
    border-radius: 8px;
    text-align: left;
    font-size: clamp(0.85rem, 1.15vw, 0.98rem);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 5px;
  }

  .choice-btn:hover:not(:disabled) {
    background: #3d3026;
    border-color: var(--gold);
  }

  .choice-btn:active:not(:disabled) { transform: scale(0.98); }
  .choice-btn:disabled { opacity: 0.42; cursor: not-allowed; }
  .choice-hint { font-size: clamp(0.72rem, 0.95vw, 0.82rem); color: var(--gold); opacity: 0.9; }

  /* Toast */
  #toast {
    position: absolute;
    top: 132px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(20, 14, 11, 0.96);
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 9px 20px;
    border-radius: 24px;
    font-size: clamp(0.8rem, 1.1vw, 0.95rem);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 30;
    white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0,0,0,0.85);
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Dolny pasek nawigacji */
  .bottom-nav {
    width: 100%;
    display: flex;
    justify-content: center;
    background: #120e0c;
    border-top: 2px solid #3a2e25;
  }

  .nav-btn {
    width: 100%;
    max-width: 880px;
    padding: clamp(12px, 1.8vh, 16px);
    background: none;
    border: none;
    color: var(--parchment);
    font-size: clamp(0.9rem, 1.25vw, 1.05rem);
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .nav-btn:hover { background: #241c17; color: var(--gold); }

  /* Modal Siatki Szpiegów */
  #spy-modal {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 25;
  }

  #spy-modal.open { opacity: 1; pointer-events: auto; }

  .sheet-container {
    width: 100%;
    max-width: 880px;
    background: #1c1613;
    border-top: 3px solid var(--gold);
    border-left: 1px solid #3a2e25;
    border-right: 1px solid #3a2e25;
    border-radius: 16px 16px 0 0;
    height: 84%;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.3s ease-out;
    padding: clamp(14px, 2.2vw, 24px);
  }

  #spy-modal.open .sheet-container { transform: translateY(0); }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid #3a2e25;
  }

  .close-btn {
    background: none;
    border: none;
    color: var(--parchment);
    font-size: 1.5rem;
    cursor: pointer;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 12px 0;
  }

  .tab-btn {
    padding: 9px 6px;
    background: #2b221b;
    color: var(--parchment);
    border: 1px solid #4a3c31;
    border-radius: 6px;
    cursor: pointer;
    font-size: clamp(0.76rem, 1.05vw, 0.92rem);
  }

  .tab-btn.active {
    background: var(--crimson);
    border-color: var(--gold);
    font-weight: bold;
  }

  .modal-content {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    align-content: start;
    padding-right: 4px;
  }

  @media (min-width: 700px) {
    .modal-content {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
  }

  .spy-card {
    background: #261f1a;
    border: 1px solid #4a3c31;
    padding: 14px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
  }

  .spy-card.plot-card {
    grid-column: 1 / -1;
    border-color: var(--gold);
    background: linear-gradient(145deg, #2b2118, #1f1712);
  }

  .spy-card h4 { color: var(--gold); font-size: clamp(0.92rem, 1.25vw, 1.08rem); }
  .spy-card p { font-size: clamp(0.8rem, 1.05vw, 0.92rem); color: #ccc0a6; line-height: 1.4; }

  .status-footer {
    padding-top: 10px;
    border-top: 1px solid #3a2e25;
    font-size: clamp(0.8rem, 1.05vw, 0.92rem);
    color: var(--gold);
    text-align: center;
  }
</style>
</head>
<body>
<div id="game-frame">
  <canvas id="bg-canvas"></canvas>
  <div id="toast">Gra zapisana</div>

  <div class="ui-layer">
    <div class="header-wrapper">
      <div class="top-hud">
        <div class="hud-row">
          <div class="hud-stats">
            <span id="turn-display">Runda: 1</span>
            <span id="intel-display">📜 Haki: 0</span>
            <span id="gold-display">💰 Złoto: 90</span>
          </div>
          <div class="hud-controls">
            <button class="icon-btn" id="mute-btn" onclick="toggleMute()" title="Dźwięk">🔊</button>
            <button class="icon-btn" onclick="resetGame()" title="Nowa gra">🔄</button>
            <a class="icon-btn" href="./index.htm" aria-label="Back to home" title="Back to home">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
            </a>
          </div>
        </div>
        <div class="rank-banner">
          <span id="rank-title">Tytuł: Nowicjusz ze Skryptorium</span>
          <span class="upkeep-warning" id="upkeep-display">Koszt tury: -4g | +3👁️</span>
          <span id="plot-progress">Spisek Koronny: 0/5</span>
        </div>
      </div>

      <div class="meters-panel">
        <div class="meter" title="Uwaga: 0% to wygnanie, 100% to egzekucja z paranoi króla!">
          <span class="meter-label">👑 Król <small id="val-king">50%</small></span>
          <div class="bar-bg" id="bg-king"><div class="bar-fill" id="bar-king"></div></div>
        </div>
        <div class="meter" title="Uwaga: 0% to ekskomunika, 100% to przejęcie władzy przez Inkwizycję!">
          <span class="meter-label">⛪ Kościół <small id="val-church">50%</small></span>
          <div class="bar-bg" id="bg-church"><div class="bar-fill" id="bar-church"></div></div>
        </div>
        <div class="meter" title="Uwaga: 0% to bunt baronów, 100% to oligarchia i zamach stanu!">
          <span class="meter-label">⚔️ Szlachta <small id="val-nobility">50%</small></span>
          <div class="bar-bg" id="bg-nobility"><div class="bar-fill" id="bar-nobility"></div></div>
        </div>
        <div class="meter" title="Przy 100% zostajesz wtrącony do lochu!">
          <span class="meter-label">👁️ Spisek <small id="val-suspicion">20%</small></span>
          <div class="bar-bg" id="bg-suspicion"><div class="bar-fill" id="bar-suspicion"></div></div>
        </div>
      </div>
    </div>

    <!-- Karta Dylematu -->
    <div class="card-viewport">
      <div id="event-card">
        <div class="book-badge" id="book-source">Kronika Dworska</div>
        <div class="portrait-circle" id="speaker-icon">⛪</div>
        <div id="speaker-name">Biskup Waleran</div>
        <div id="event-title">Tytuł wydarzenia</div>
        <div id="event-desc">Opis wydarzenia...</div>
      </div>
    </div>

    <!-- Przyciski Wyboru -->
    <div class="choices-container" id="choices-box"></div>

    <!-- Dolna Nawigacja -->
    <div class="bottom-nav">
      <button class="nav-btn" onclick="openSpyModal()">🗡️ Siatka Szpiegów, Lombardy i Wielki Spisek</button>
    </div>
  </div>

  <!-- Modal Siatki Szpiegów -->
  <div id="spy-modal">
    <div class="sheet-container">
      <div class="modal-header">
        <h3>OPERACJE W CIENIU</h3>
        <button class="close-btn" onclick="closeSpyModal()">✕</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-spies" onclick="switchTab('spies')">👥 Agenci</button>
        <button class="tab-btn" id="tab-market" onclick="switchTab('market')">🧪 Alchemia</button>
        <button class="tab-btn" id="tab-assassinations" onclick="switchTab('assassinations')">🗡️ Zamachy</button>
        <button class="tab-btn" id="tab-crown" onclick="switchTab('crown')">👑 Korona</button>
      </div>
      <div class="modal-content" id="modal-body"></div>
      <div class="status-footer" id="modal-status"></div>
    </div>
  </div>
</div>

<script>
  // --- 1. SYNTEZATOR DŹWIĘKÓW (WEB AUDIO API) ---
  let audioCtx = null;
  let isMuted = false;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type) {
    if (isMuted) return;
    initAudio();
    const now = audioCtx.currentTime;

    if (type === 'click') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.07);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.07);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.07);
    } 
    else if (type === 'coin') {
      [987.77, 1318.51].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.06);
        gain.gain.setValueAtTime(0.15, now + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.008, now + i * 0.06 + 0.18);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.18);
      });
    } 
    else if (type === 'dagger') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.22);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.22);
    }
    else if (type === 'fanfare') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.1);
        gain.gain.setValueAtTime(0.2, now + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.008, now + i * 0.1 + 0.35);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.35);
      });
    }
    else if (type === 'gameover') {
      [220, 196, 164.81].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + i * 0.22);
        gain.gain.setValueAtTime(0.15, now + i * 0.22);
        gain.gain.exponentialRampToValueAtTime(0.008, now + i * 0.22 + 0.45);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.22); osc.stop(now + i * 0.22 + 0.45);
      });
    }
  }

  function toggleMute() {
    isMuted = !isMuted;
    document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
  }

  // --- 2. TŁO CANVAS ---
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);

  function initParticles() {
    resizeCanvas();
    particles = [];
    const count = Math.min(60, Math.floor(window.innerWidth / 25));
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.4 + 0.8,
        vy: -(Math.random() * 0.65 + 0.2),
        vx: (Math.random() - 0.5) * 0.45,
        alpha: Math.random() * 0.65 + 0.15
      });
    }
  }

  function animateCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (state.stats.suspicion > 50) {
      const intensity = ((state.stats.suspicion - 50) / 50) * 0.42;
      const radius = Math.max(canvas.width, canvas.height);
      const grad = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, radius * 0.15,
        canvas.width / 2, canvas.height / 2, radius * 0.75
      );
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, `rgba(175, 15, 15, ${intensity})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    particles.forEach(p => {
      p.y += p.vy; p.x += p.vx;
      if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(245, 175, 65, ${p.alpha})`;
      ctx.fill();

  function updateUI() {
    document.getElementById('turn-display').innerText = `Runda: ${state.turn}`;
    document.getElementById('gold-display').innerText = `💰 Złoto: ${state.gold}`;
    document.getElementById('intel-display').innerText = `📜 Haki: ${state.intel}`;

    const upkeepGold = state.spies * 4;
    document.getElementById('upkeep-display').innerText = `Utrzymanie tury: -${upkeepGold}g | +3👁️`;

    const currentRank = courtRanks[state.rankIndex] || courtRanks[0];
    document.getElementById('rank-title').innerText = `Tytuł: ${currentRank.title}`;
    document.getElementById('plot-progress').innerText = `Spisek Koronny: ${state.plotStage}/${crownPlotStages.length}`;

    ['king', 'church', 'nobility', 'suspicion'].forEach(k => {
      const val = state.stats[k];
      document.getElementById(`bar-${k}`).style.width = `${val}%`;
      document.getElementById(`val-${k}`).innerText = `${val}%`;

      const bg = document.getElementById(`bg-${k}`);
      const isDanger = (k === 'suspicion') ? (val >= 80) : (val <= 18 || val >= 85);
      bg.classList.toggle('danger-zone', isDanger);
    });
  }

  function loadNextEvent() {
    const card = document.getElementById('event-card');
    card.classList.add('card-hidden');

    setTimeout(() => {
      let idx = Math.floor(Math.random() * eventsDB.length);
      if (idx === state.lastEventIndex && eventsDB.length > 1) {
        idx = (idx + 1) % eventsDB.length;
      }
      state.lastEventIndex = idx;
      const ev = eventsDB[idx];

      document.getElementById('book-source').innerText = `Inspiracja: ${ev.book}`;
      document.getElementById('speaker-icon').innerText = ev.icon;
      document.getElementById('speaker-name').innerText = ev.speaker;
      document.getElementById('event-title').innerText = ev.title;
      document.getElementById('event-desc').innerText = ev.text;

      const box = document.getElementById('choices-box');
      box.innerHTML = '';

      ev.choices.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        const locked = (ch.reqGold && state.gold < ch.reqGold) || (ch.reqIntel && state.intel < ch.reqIntel);
        btn.disabled = locked;
        btn.innerHTML = `<span>${ch.text}</span><span class="choice-hint">${ch.hint}</span>`;

        btn.onmouseenter = () => previewOutcome(ch.outcomes, true);
        btn.onmouseleave = () => previewOutcome(ch.outcomes, false);
        btn.onclick = () => selectChoice(ch.outcomes);
        box.appendChild(btn);
      });

      card.classList.remove('card-hidden');
    }, 240);
  }

  function previewOutcome(outcomes, active) {
    ['king', 'church', 'nobility', 'suspicion'].forEach(key => {
      const bg = document.getElementById(`bg-${key}`);
      bg.classList.remove('pulse-up', 'pulse-down');
      if (active && outcomes[key]) {
        bg.classList.add(outcomes[key] > 0 ? 'pulse-up' : 'pulse-down');
      }
    });
  }

  function selectChoice(outcomes) {
    previewOutcome(outcomes, false);
    if (outcomes.gold && outcomes.gold > 0) playSound('coin');
    else playSound('click');

    if (navigator.vibrate) navigator.vibrate(35);

    // 1. Efekt wybranej opcji
    state.gold += outcomes.gold || 0;
    state.intel += outcomes.intel || 0;
    ['king', 'church', 'nobility', 'suspicion'].forEach(k => {
      if (outcomes[k]) state.stats[k] = Math.max(0, Math.min(100, state.stats[k] + outcomes[k]));
    });

    // 2. Koszt utrzymania tury (Hardcore Upkeep)
    const upkeepCost = state.spies * 4;
    state.gold -= upkeepCost;
    state.stats.suspicion = Math.min(100, state.stats.suspicion + 3);

    // Kara za bankructwo (niewypłacony żołd szpiegów)
    if (state.gold < 0) {
      state.gold = 0;
      state.stats.suspicion = Math.min(100, state.stats.suspicion + 8);
      state.stats.nobility = Math.max(0, state.stats.nobility - 5);
      showToast("Brak złota na żołd! Nieopłaceni szpiedzy zaczynają sypać (+8👁️)");
    }

    state.turn++;
    checkRankProgression();
    saveGame();
    updateUI();

    if (!checkGameOver()) loadNextEvent();
  }

    playSound('fanfare');
    localStorage.removeItem(STORAGE_KEY);
    closeSpyModal();
    document.getElementById('book-source').innerText = "Triumf Wielkiego Spisku";
    document.getElementById('speaker-icon').innerText = "👑";
    document.getElementById('speaker-name').innerText = "ZWYCIĘSTWO! NOWY MONARCHA";
    document.getElementById('event-title').innerText = `Zdobyłeś tron w rundzie ${state.turn}`;
    document.getElementById('event-desc').innerText =
      "Po miesiącach bezwzględnych intryg, przekupstw u Lombardów i tajnych układów w opactwach zasiadasz na tronie. Całe królestwo klęka przed Twoim majestatem!";

    const box = document.getElementById('choices-box');
    box.innerHTML = `<button class="choice-btn" onclick="resetGame()">👑 Rozpocznij nowe panowanie</button>`;
  }

  function checkGameOver() {
    let reason = "";
    // Porażki przez 100% Spisku lub skrajności frakcji (0% oraz 100%)
    if (state.stats.suspicion >= 100) {
      reason = "Inkwizytor Bernard Gui i straż królewska wdarli się do twoich komnat. Twoja siatka została zdemaskowana, a ty trafiasz na szafot!";
    } else if (state.stats.king <= 0) {
      reason = "Król uznał cię za zdrajcę korony i rozkazał uwięzić w twierdzy Château Gaillard.";
    } else if (state.stats.king >= 100) {
      reason = "Twoja potęga na dworze urosła tak bardzo, że paranoiczny król z zazdrości kazał cię ściąć, tak jak szambelana de Marigny!";
    } else if (state.stats.church <= 0) {
      reason = "Trybunał Inkwizycji obłożył cię klątwą ekskomuniki i posłał na stos jak heretyków z opactwa.";
    } else if (state.stats.church >= 100) {
      reason = "Biskup Waleran i kapituła zdominowali państwo. Wprowadzono rządy teokracji, a świecki kanclerz stał się zbędny.";
    } else if (state.stats.nobility <= 0) {
      reason = "Zbuntowani możni z rodów Zarembów i Hamleighów wtargnęli do zamku i rozszarpali twoją straż.";
    } else if (state.stats.nobility >= 100) {
      reason = "Rozzuchwaleni baronowie stali się potężniejsi od korony, obalili dwór i podzielili królestwo między siebie.";
    }

    if (reason) {
      playSound('gameover');
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('book-source').innerText = "Upadek Szarej Eminencji";
      document.getElementById('speaker-icon').innerText = "💀";
      document.getElementById('speaker-name').innerText = "KONIEC GRY";
      document.getElementById('event-title').innerText = `Przetrwałeś rund: ${state.turn} (${courtRanks[state.rankIndex].title})`;
      document.getElementById('event-desc').innerText = reason;

      const box = document.getElementById('choices-box');
      box.innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 Zacznij nową intrygę</button>`;
      return true;
    }
    return false;
  }

  // --- 5. LOGIKA MODALA SZPIEGÓW I WIELKIEGO SPISKU ---
  function openSpyModal() {
    playSound('click');
    document.getElementById('spy-modal').classList.add('open');
    renderModalTab();
  }

  function closeSpyModal() {
    playSound('click');
    document.getElementById('spy-modal').classList.remove('open');
  }

  function switchTab(tab) {
    playSound('click');
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    renderModalTab();
  }

  function renderModalTab() {
    const body = document.getElementById('modal-body');
    body.innerHTML = '';

    if (currentTab === 'spies') {
      body.innerHTML += `
        <div class="spy-card">
          <div>
            <h4>Zwerbuj Nowego Szpiega</h4>
            <p>Zwiększa możliwości operacyjne, ale podnosi utrzymanie o 4g/turę. Koszt: 80 Złota.</p>
          </div>
          <button class="choice-btn" ${state.gold < 80 || state.spies >= state.maxSpies ? 'disabled' : ''} onclick="recruitSpy()">Zwerbuj (-80g)</button>
        </div>
        <div class="spy-card">
          <div>
            <h4>Infiltracja Skryptorium i Kancelarii</h4>
            <p>Szpieg wykrada tajne pergaminy (+1 Hak 📜, +10 Spisek).</p>
          </div>
          <button class="choice-btn" ${state.gold < 30 || state.spies <= 0 ? 'disabled' : ''} onclick="gatherIntel()">Wyślij agenta (-30g)</button>
        </div>`;
    } else if (currentTab === 'market') {
      body.innerHTML += `
        <div class="spy-card">
          <div>
            <h4>Maść z Tojadu ze Skryptorium („Imię róży”)</h4>
            <p>Trucizna nakładana na karty ksiąg lub puchary. Zwiększa szansę zamachu o 30%. Posiadasz: ${state.tojad}</p>
          </div>
          <button class="choice-btn" ${state.gold < 65 ? 'disabled' : ''} onclick="buyPoison()">Kup truciznę (-65g)</button>
        </div>
        <div class="spy-card">
          <div>
            <h4>Przekupstwo Straży i Świadków</h4>
            <p>Zatarcie śladów w śledztwie inkwizytorów (-22 Spisek).</p>
          </div>
          <button class="choice-btn" ${state.gold < 55 || state.stats.suspicion <= 0 ? 'disabled' : ''} onclick="bribeGuards()">Opłać milczenie (-55g)</button>
        </div>`;
    } else if (currentTab === 'assassinations') {
      if (state.targets.length === 0) {
        body.innerHTML = `<p style="text-align:center; padding:20px; grid-column: 1/-1;">Wszyscy główni rywale zostali wyeliminowani.</p>`;
      }
      state.targets.forEach((t, idx) => {
        const chance = Math.min(95, Math.round((t.baseChance + (state.tojad > 0 ? 0.3 : 0)) * 100));
        body.innerHTML += `
          <div class="spy-card">
            <div>
              <h4>Cel: ${t.name}</h4>
              <p>Ochrona: ${t.guard} | Szansa sukcesu: <b>${chance}%</b> ${state.tojad > 0 ? '(+Tojad)' : ''}</p>
            </div>
            <button class="choice-btn" ${state.gold < 95 || state.spies <= 0 ? 'disabled' : ''} onclick="assassinate(${idx}, ${chance})">Zleć zabójstwo (-95g)</button>
          </div>`;
      });
    } else if (currentTab === 'crown') {
      if (state.plotStage >= crownPlotStages.length) {
        body.innerHTML = `<p style="text-align:center; padding:20px; grid-column: 1/-1;">Korona należy już do Ciebie!</p>`;
      } else {
        const st = crownPlotStages[state.plotStage];
        const canAfford = state.gold >= st.costGold && state.intel >= st.costIntel;
        body.innerHTML += `
          <div class="spy-card plot-card">
            <div>
              <h4>${st.name}</h4>
              <p>${st.desc}</p>
              <p style="color:var(--gold); margin-top:6px;">Wymogi: ${st.costGold} Złota, ${st.costIntel} Haki 📜 | Ryzyko: +${st.suspicionGain} Spisek</p>
            </div>
            <button class="choice-btn" ${!canAfford ? 'disabled' : ''} onclick="advanceCrownPlot()">
              👑 Zrealizuj etap spisku (-${st.costGold}g, -${st.costIntel} 📜)
            </button>
          </div>`;
      }
    }

    document.getElementById('modal-status').innerText =
      `Złoto: ${state.gold} | Haki: ${state.intel} | Szpiedzy: ${state.spies}/${state.maxSpies} | Tojad: ${state.tojad}`;
  }

  function advanceCrownPlot() {
    const st = crownPlotStages[state.plotStage];
    state.gold -= st.costGold;
    state.intel -= st.costIntel;
    state.stats.suspicion = Math.min(100, state.stats.suspicion + st.suspicionGain);
    state.plotStage++;

    saveGame();
    updateUI();

    if (checkGameOver()) {
      closeSpyModal();
      return;
    }

    if (state.plotStage >= crownPlotStages.length) {
      triggerVictory();
    } else {
      playSound('fanfare');
      showToast(`Ukończono etap ${state.plotStage}/${crownPlotStages.length} Wielkiego Spisku!`);
      renderModalTab();
    }
  }

  function recruitSpy() {
    playSound('coin');
    state.gold -= 80; state.spies++;
    saveGame(); updateUI(); renderModalTab();
    showToast("Zwerbowano nowego szpiega!");
  }

  function gatherIntel() {
    playSound('click');
    state.gold -= 30; state.intel++;
    state.stats.suspicion = Math.min(100, state.stats.suspicion + 10);
    saveGame(); updateUI(); renderModalTab();
    showToast("Zdobyto nowy Hak (+1 📜)");
    if (checkGameOver()) closeSpyModal();
  }

  function buyPoison() {
    playSound('coin');
    state.gold -= 65; state.tojad++;
    saveGame(); updateUI(); renderModalTab();
    showToast("Zakupiono Maść z Tojadu!");
  }

  function bribeGuards() {
    playSound('coin');
    state.gold -= 55;
    state.stats.suspicion = Math.max(0, state.stats.suspicion - 22);
    saveGame(); updateUI(); renderModalTab();
    showToast("Śledczy przekupieni (-22 Spisek)");
  }

  function assassinate(index, chance) {
    playSound('dagger');
    const target = state.targets[index];
    state.gold -= 95;
    if (state.tojad > 0) state.tojad--;

    if (Math.random() * 100 <= chance) {
      showToast(`Zamach udany! ${target.name} wyeliminowany (+1 📜).`);
      state.intel++;
      state.stats.suspicion = Math.min(100, state.stats.suspicion + 14);
      state.targets.splice(index, 1);
    } else {
      showToast(`Wpadka! Zamachowiec pojmany na gorącym uczynku!`);
      state.spies = Math.max(0, state.spies - 1);
      state.stats.suspicion = Math.min(100, state.stats.suspicion + target.risk);
    }
    saveGame(); updateUI(); renderModalTab();
    if (checkGameOver()) closeSpyModal();
  }

  // Start gry
  initParticles();
  animateCanvas();
  updateUI();
  loadNextEvent();
</script>
</body>
</html>
