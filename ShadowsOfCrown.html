<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cienie Korony - Edycja Królewska</title>
<style>
  :root {
    --bg-dark: #14110f;
    --parchment: #e8dcb8;
    --parchment-dark: #c9b789;
    --ink: #2b2118;
    --gold: #f5c542;
    --crimson: #8f1d1d;
    --emerald: #1e6b3b;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    font-family: 'Georgia', serif;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: #080605;
    color: var(--parchment);
    overflow: hidden;
  }

  /* Pełnoekranowy kontener dopasowujący się do każdego urządzenia */
  #game-frame {
    width: 100vw;
    height: 100dvh;
    background: radial-gradient(circle at center, #2b2019 0%, var(--bg-dark) 75%, #090706 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  #bg-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .ui-layer {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    justify-content: space-between;
    align-items: center;
  }

  /* Sekcja górna rozciągnięta na całą szerokość z wyśrodkowaną zawartością */
  .header-wrapper {
    width: 100%;
    background: rgba(12, 9, 8, 0.85);
    border-bottom: 2px solid #3a2e25;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-hud {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 20px;
  }

  .hud-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: clamp(0.95rem, 1.5vw, 1.2rem);
    font-weight: bold;
    color: var(--gold);
  }

  .rank-banner {
    font-size: clamp(0.8rem, 1.2vw, 1rem);
    color: #d9c89e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(58, 46, 37, 0.45);
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #4a3c31;
  }

  .hud-stats { display: flex; gap: clamp(14px, 3vw, 28px); }
  .hud-controls { display: flex; gap: 8px; }

  .icon-btn {
    background: #261f1a;
    border: 1px solid #4a3c31;
    color: var(--parchment);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: clamp(0.85rem, 1.2vw, 1.05rem);
    transition: border-color 0.2s, background 0.2s;
  }

  .icon-btn:hover { border-color: var(--gold); background: #332922; }

  /* Cztery wskaźniki stanu */
  .meters-panel {
    width: 100%;
    max-width: 1100px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(10px, 2.5vw, 24px);
    padding: 8px 20px 14px 20px;
  }

  .meter {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: clamp(0.78rem, 1.2vw, 1rem);
  }

  .meter-label { margin-bottom: 6px; color: #d1c4a5; font-weight: bold; }

  .bar-bg {
    width: 100%;
    height: clamp(10px, 1.4vh, 14px);
    background: #2b231d;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid #4a3c31;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .bar-fill {
    height: 100%;
    width: 50%;
    transition: width 0.4s ease-out;
  }

  #bar-king { background: #9b59b6; }
  #bar-church { background: #f1c40f; }
  #bar-nobility { background: #e74c3c; }
  #bar-suspicion { background: #34495e; }

  .pulse-up { box-shadow: 0 0 12px #2ecc71; transform: scale(1.05); }
  .pulse-down { box-shadow: 0 0 12px #e74c3c; transform: scale(1.05); }

  /* Karta Dylematu - elastyczna w pionie i poziomie */
  .card-viewport {
    flex: 1;
    width: 100%;
    max-width: 860px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: clamp(12px, 2.5vh, 28px) 20px;
    position: relative;
    min-height: 0;
  }

  #event-card {
    background: linear-gradient(145deg, var(--parchment), var(--parchment-dark));
    color: var(--ink);
    width: 100%;
    height: 100%;
    max-height: 420px;
    padding: clamp(18px, 3.5vh, 36px) clamp(18px, 4vw, 44px);
    border-radius: 12px;
    border: 4px double #594433;
    box-shadow: 0 18px 45px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.28s;
    overflow-y: auto;
  }

  .card-hidden {
    opacity: 0;
    transform: translateY(35px) scale(0.96);
  }

  .portrait-circle {
    width: clamp(64px, 9vh, 90px);
    height: clamp(64px, 9vh, 90px);
    border-radius: 50%;
    background: #3a2e25;
    border: 3px solid #594433;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(1.9rem, 4vh, 2.8rem);
    margin-bottom: 12px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    flex-shrink: 0;
  }

  #speaker-name {
    font-size: clamp(1.15rem, 2vw, 1.5rem);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--crimson);
    margin-bottom: 4px;
  }

  #event-title {
    font-size: clamp(0.85rem, 1.3vw, 1.05rem);
    font-style: italic;
    color: #594433;
    margin-bottom: clamp(10px, 2vh, 18px);
  }

  #event-desc {
    font-size: clamp(0.98rem, 1.6vw, 1.25rem);
    line-height: 1.5;
    max-width: 680px;
  }

  /* Przyciski decyzji - 1 kolumna na telefonie, 2-3 kolumny na szerokich ekranach */
  .choices-container {
    width: 100%;
    max-width: 860px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 0 20px clamp(12px, 2vh, 20px) 20px;
  }

  @media (min-width: 768px) {
    .choices-container {
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
  }

  .choice-btn {
    background: rgba(43, 34, 27, 0.94);
    color: var(--parchment);
    border: 1px solid #5c4838;
    padding: clamp(11px, 1.8vh, 16px) 16px;
    border-radius: 8px;
    text-align: left;
    font-size: clamp(0.88rem, 1.2vw, 1.02rem);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
  }

  .choice-btn:hover:not(:disabled) {
    background: #3d3026;
    border-color: var(--gold);
  }

  .choice-btn:active:not(:disabled) { transform: scale(0.98); }
  .choice-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .choice-hint { font-size: clamp(0.74rem, 1vw, 0.85rem); color: var(--gold); opacity: 0.9; }

  /* Toast */
  #toast {
    position: absolute;
    top: 130px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(20, 14, 11, 0.96);
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 10px 22px;
    border-radius: 24px;
    font-size: clamp(0.85rem, 1.2vw, 1rem);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 30;
    white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0,0,0,0.8);
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Dolny pasek nawigacji */
  .bottom-nav {
    width: 100%;
    display: flex;
    justify-content: center;
    background: #120e0c;
    border-top: 2px solid #3a2e25;
  }

  .nav-btn {
    width: 100%;
    max-width: 860px;
    padding: clamp(13px, 2vh, 18px);
    background: none;
    border: none;
    color: var(--parchment);
    font-size: clamp(0.92rem, 1.3vw, 1.1rem);
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .nav-btn:hover { background: #241c17; color: var(--gold); }

  /* Modal Siatki Szpiegów - responsywny na telefonie i laptopie */
  #spy-modal {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 25;
  }

  #spy-modal.open { opacity: 1; pointer-events: auto; }

  .sheet-container {
    width: 100%;
    max-width: 860px;
    background: #1c1613;
    border-top: 3px solid var(--gold);
    border-left: 1px solid #3a2e25;
    border-right: 1px solid #3a2e25;
    border-radius: 16px 16px 0 0;
    height: 82%;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.3s ease-out;
    padding: clamp(16px, 2.5vw, 28px);
  }

  #spy-modal.open .sheet-container { transform: translateY(0); }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    border-bottom: 1px solid #3a2e25;
  }

  .close-btn {
    background: none;
    border: none;
    color: var(--parchment);
    font-size: 1.5rem;
    cursor: pointer;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 14px 0;
  }

  .tab-btn {
    padding: 10px 6px;
    background: #2b221b;
    color: var(--parchment);
    border: 1px solid #4a3c31;
    border-radius: 6px;
    cursor: pointer;
    font-size: clamp(0.78rem, 1.1vw, 0.95rem);
  }

  .tab-btn.active {
    background: var(--crimson);
    border-color: var(--gold);
    font-weight: bold;
  }

  .modal-content {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    align-content: start;
    padding-right: 4px;
  }

  @media (min-width: 700px) {
    .modal-content {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
  }

  .spy-card {
    background: #261f1a;
    border: 1px solid #4a3c31;
    padding: 16px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
  }

  .spy-card.plot-card {
    grid-column: 1 / -1;
    border-color: var(--gold);
    background: linear-gradient(145deg, #2b2118, #1f1712);
  }

  .spy-card h4 { color: var(--gold); font-size: clamp(0.95rem, 1.3vw, 1.1rem); }
  .spy-card p { font-size: clamp(0.82rem, 1.1vw, 0.95rem); color: #ccc0a6; line-height: 1.4; }

  .status-footer {
    padding-top: 12px;
    border-top: 1px solid #3a2e25;
    font-size: clamp(0.82rem, 1.1vw, 0.95rem);
    color: var(--gold);
    text-align: center;
  }
</style>
</head>
<body>

<div id="game-frame">
  <canvas id="bg-canvas"></canvas>
  <div id="toast">Gra zapisana</div>

  <div class="ui-layer">
    <!-- Sekcja Nagłówka i Wskaźników -->
    <div class="header-wrapper">
      <div class="top-hud">
        <div class="hud-row">
          <div class="hud-stats">
            <span id="turn-display">Runda: 1</span>
            <span id="intel-display">📜 0</span>
            <span id="gold-display">💰 100</span>
          </div>
          <div class="hud-controls">
            <button class="icon-btn" id="mute-btn" onclick="toggleMute()" title="Dźwięk">🔊</button>
            <button class="icon-btn" onclick="resetGame()" title="Nowa gra">🔄</button>
          </div>
        </div>
        <div class="rank-banner">
          <span id="rank-title">Tytuł: Szeptacz Dworski</span>
          <span id="plot-progress">Spisek Koronny: 0/4</span>
        </div>
      </div>

      <div class="meters-panel">
        <div class="meter">
          <span class="meter-label">👑 Król</span>
          <div class="bar-bg" id="bg-king"><div class="bar-fill" id="bar-king"></div></div>
        </div>
        <div class="meter">
          <span class="meter-label">⛪ Kościół</span>
          <div class="bar-bg" id="bg-church"><div class="bar-fill" id="bar-church"></div></div>
        </div>
        <div class="meter">
          <span class="meter-label">⚔️ Szlachta</span>
          <div class="bar-bg" id="bg-nobility"><div class="bar-fill" id="bar-nobility"></div></div>
        </div>
        <div class="meter">
          <span class="meter-label">👁️ Spisek</span>
          <div class="bar-bg" id="bg-suspicion"><div class="bar-fill" id="bar-suspicion"></div></div>
        </div>
      </div>
    </div>

    <!-- Karta Dylematu -->
    <div class="card-viewport">
      <div id="event-card">
        <div class="portrait-circle" id="speaker-icon">⛪</div>
        <div id="speaker-name">Biskup Anselm</div>
        <div id="event-title">Przechwycony Posłaniec</div>
        <div id="event-desc">Opis wydarzenia...</div>
      </div>
    </div>

    <!-- Przyciski Wyboru -->
    <div class="choices-container" id="choices-box"></div>

    <!-- Dolna Nawigacja -->
    <div class="bottom-nav">
      <button class="nav-btn" onclick="openSpyModal()">🗡️ Siatka Szpiegów i Wielki Spisek</button>
    </div>
  </div>

  <!-- Modal Siatki Szpiegów -->
  <div id="spy-modal">
    <div class="sheet-container">
      <div class="modal-header">
        <h3>OPERACJE W CIENIU</h3>
        <button class="close-btn" onclick="closeSpyModal()">✕</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-spies" onclick="switchTab('spies')">👥 Agenci</button>
        <button class="tab-btn" id="tab-market" onclick="switchTab('market')">🧪 Rynek</button>
        <button class="tab-btn" id="tab-assassinations" onclick="switchTab('assassinations')">🗡️ Zamachy</button>
        <button class="tab-btn" id="tab-crown" onclick="switchTab('crown')">👑 Korona</button>
      </div>
      <div class="modal-content" id="modal-body"></div>
      <div class="status-footer" id="modal-status"></div>
    </div>
  </div>
</div>

<script>
  // --- 1. SYNTEZATOR DŹWIĘKÓW (WEB AUDIO API) ---
  let audioCtx = null;
  let isMuted = false;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type) {
    if (isMuted) return;
    initAudio();
    const now = audioCtx.currentTime;

    if (type === 'click') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.07);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.07);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.07);
    } 
    else if (type === 'coin') {
      [987.77, 1318.51].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.06);
        gain.gain.setValueAtTime(0.15, now + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.008, now + i * 0.06 + 0.18);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.18);
      });
    } 
    else if (type === 'dagger') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.22);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.22);
    }
    else if (type === 'fanfare') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.1);
        gain.gain.setValueAtTime(0.2, now + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.008, now + i * 0.1 + 0.35);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.35);
      });
    }
    else if (type === 'gameover') {
      [220, 196, 164.81].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + i * 0.22);
        gain.gain.setValueAtTime(0.15, now + i * 0.22);
        gain.gain.exponentialRampToValueAtTime(0.008, now + i * 0.22 + 0.45);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i * 0.22); osc.stop(now + i * 0.22 + 0.45);
      });
    }
  }

  function toggleMute() {
    isMuted = !isMuted;
    document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
  }

  // --- 2. TŁO CANVAS (RESPONSYWNE) ---
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);

  function initParticles() {
    resizeCanvas();
    particles = [];
    const count = Math.min(60, Math.floor(window.innerWidth / 25));
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.4 + 0.8,
        vy: -(Math.random() * 0.65 + 0.2),
        vx: (Math.random() - 0.5) * 0.45,
        alpha: Math.random() * 0.65 + 0.15
      });
    }
  }

  function animateCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (state.stats.suspicion > 50) {
      const intensity = ((state.stats.suspicion - 50) / 50) * 0.38;
      const radius = Math.max(canvas.width, canvas.height);
      const grad = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, radius * 0.15,
        canvas.width / 2, canvas.height / 2, radius * 0.75
      );
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, `rgba(160, 20, 20, ${intensity})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    particles.forEach(p => {
      p.y += p.vy; p.x += p.vx;
      if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(245, 175, 65, ${p.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(animateCanvas);
  }

  // --- 3. TYTUŁY DWORSKIE I WIELKI SPISEK KORONNY ---
  const courtRanks = [
    { minTurn: 1,  title: "Szeptacz Dworski" },
    { minTurn: 5,  title: "Królewski Szambelan" },
    { minTurn: 10, title: "Wielki Kanclerz" },
    { minTurn: 16, title: "Książę Regent" },
    { minTurn: 22, title: "Szara Eminencja" }
  ];

  const crownPlotStages = [
    {
      stage: 0,
      name: "Etap I: Przekupstwo Królewskich Kronikarzy",
      desc: "Zleć skrybom sfałszowanie starych pergaminów, aby wykazać twoje rzekome pokrewieństwo z pierwszą dynastią.",
      costGold: 80, costIntel: 1, suspicionGain: 10
    },
    {
      stage: 1,
      name: "Etap II: Tajny Pakt z Baronami",
      desc: "Obiecaj arystokracji przywileje podatkowe w zamian za poparcie twojej regencji podczas kryzysu.",
      costGold: 110, costIntel: 2, suspicionGain: 15
    },
    {
      stage: 2,
      name: "Etap III: Neutralizacja Gwardii Przybocznej",
      desc: "Obsadź swoich ludzi na czele nocnej straży pałacowej i odetnij króla od lojalnych rycerzy.",
      costGold: 140, costIntel: 2, suspicionGain: 20
    },
    {
      stage: 3,
      name: "Etap IV: Noc Długich Sztyletów (Uzurpacja)",
      desc: "Zmuś monarchę do abdykacji i włóż koronę na własną skroń. Zwycięstwo w grze!",
      costGold: 180, costIntel: 3, suspicionGain: 15
    }
  ];

  const STORAGE_KEY = 'cienie_korony_save_v2';

  const defaultState = {
    turn: 1,
    gold: 100,
    intel: 0,
    spies: 1,
    maxSpies: 3,
    tojad: 0,
    plotStage: 0,
    rankIndex: 0,
    stats: { king: 50, church: 50, nobility: 50, suspicion: 15 },
    targets: [
      { id: "marshal", name: "Marszałek Gerard Vane", guard: "Wysoka", baseChance: 0.45, risk: 35 },
      { id: "bishop", name: "Biskup Anselm", guard: "Średnia", baseChance: 0.65, risk: 25 },
      { id: "inquisitor", name: "Wielki Inkwizytor", guard: "Bardzo Wysoka", baseChance: 0.35, risk: 40 }
    ]
  };

  let state = loadGame();

  function saveGame() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function loadGame() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return Object.assign({}, defaultState, JSON.parse(saved));
    } catch (e) {}
    return JSON.parse(JSON.stringify(defaultState));
  }

  function resetGame() {
    playSound('click');
    localStorage.removeItem(STORAGE_KEY);
    state = JSON.parse(JSON.stringify(defaultState));
    updateUI();
    loadNextEvent();
    showToast("Rozpoczęto nową intrygę");
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function checkRankProgression() {
    let newIndex = 0;
    courtRanks.forEach((r, idx) => {
      if (state.turn >= r.minTurn) newIndex = idx;
    });
    if (newIndex > state.rankIndex) {
      state.rankIndex = newIndex;
      state.gold += 40;
      playSound('fanfare');
      showToast(`Awans! Nowy tytuł: ${courtRanks[newIndex].title} (+40g)`);
    }
  }

  // --- 4. BAZA KART DYLEMATÓW ---
  const eventsDB = [
    {
      speaker: "Biskup Anselm", icon: "⛪", title: "Przechwycony Posłaniec",
      text: "W ręce twojej straży wpadł kurier zmierzający do Rzymu z listem obciążającym biskupa stołecznego.",
      choices: [
        { text: "Zaszantażuj biskupa i zażądaj dziesięciny", hint: "+75 Złota, +15 Spisek, -20 Kościół", outcomes: { gold: 75, suspicion: 15, church: -20 } },
        { text: "Oddaj dowody bezpośrednio monarsze", hint: "+20 Król, -25 Kościół, -5 Spisek", outcomes: { king: 20, church: -25, suspicion: -5 } },
        { text: "Spal list na oczach biskupa w zamian za haki", hint: "+15 Kościół, +1 Hak, -5 Król", outcomes: { church: 15, intel: 1, king: -5 } }
      ]
    },
    {
      speaker: "Marszałek Vane", icon: "⚔️", title: "Szepty w Krużgankach",
      text: "Marszałek żąda zwiększenia żołdu dla gwardii królewskiej, grożąc wypowiedzeniem posłuszeństwa.",
      choices: [
        { text: "Opłać gwardię z własnej szkatuły (Wymaga 50g)", hint: "-50 Złota, +15 Szlachta, +10 Król", reqGold: 50, outcomes: { gold: -50, nobility: 15, king: 10, suspicion: -5 } },
        { text: "Wykorzystaj zdobyty Hak, by go uciszyć (Wymaga 1 Haka)", hint: "-1 Hak, +15 Król, +10 Spisek", reqIntel: 1, outcomes: { intel: -1, king: 15, suspicion: 10 } },
        { text: "Oskarż go publicznie o zdradę", hint: "+10 Król, -20 Szlachta, +10 Spisek", outcomes: { king: 10, nobility: -20, suspicion: 10 } }
      ]
    },
    {
      speaker: "Lady Elena", icon: "🍷", title: "Królewska Uczta",
      text: "Lady Elena proponuje dosypanie środka nasennego do pucharu posła, aby wykraść jego szyfry.",
      choices: [
        { text: "Weź udział w spisku", hint: "+45 Złota, +1 Hak, +20 Spisek", outcomes: { gold: 45, intel: 1, suspicion: 20, nobility: 10 } },
        { text: "Odmów i ostrzeż straż zamkową", hint: "-10 Spisek, +10 Król, -15 Szlachta", outcomes: { suspicion: -10, king: 10, nobility: -15 } }
      ]
    },
    {
      speaker: "Wielki Inkwizytor", icon: "🔥", title: "Polowanie na Heretyków",
      text: "Inkwizycja domaga się prawa do przeszukania komnat najbogatszych kupców w stolicy.",
      choices: [
        { text: "Pozwól im działać w zamian za udział w łupach", hint: "+65 Złota, +15 Kościół, -15 Szlachta", outcomes: { gold: 65, church: 15, nobility: -15, suspicion: 10 } },
        { text: "Zablokuj dekret za plecami króla", hint: "-15 Kościół, +15 Szlachta, +10 Spisek", outcomes: { church: -15, nobility: 15, suspicion: 10 } }
      ]
    },
    {
      speaker: "Mistrz Gildii Kupieckiej", icon: "⚖️", title: "Podatek Portowy",
      text: "Kupcy oferują ci potajemną łapówkę w zamian za obniżenie ceł na przyprawy ze Wschodu.",
      choices: [
        { text: "Przyjmij złoto i sfałszuj edykt", hint: "+80 Złota, +15 Spisek, -10 Król", outcomes: { gold: 80, suspicion: 15, king: -10 } },
        { text: "Wymuś na nich zeznania przeciw szlachcie", hint: "+1 Hak, +15 Król, -10 Szlachta", outcomes: { intel: 1, king: 15, nobility: -10 } }
      ]
    }
  ];

  let currentTab = 'spies';

  function updateUI() {
    document.getElementById('turn-display').innerText = `Runda: ${state.turn}`;
    document.getElementById('gold-display').innerText = `💰 ${state.gold}`;
    document.getElementById('intel-display').innerText = `📜 ${state.intel}`;

    const currentRank = courtRanks[state.rankIndex] || courtRanks[0];
    document.getElementById('rank-title').innerText = `Tytuł: ${currentRank.title}`;
    document.getElementById('plot-progress').innerText = `Spisek Koronny: ${state.plotStage}/4`;

    document.getElementById('bar-king').style.width = `${state.stats.king}%`;
    document.getElementById('bar-church').style.width = `${state.stats.church}%`;
    document.getElementById('bar-nobility').style.width = `${state.stats.nobility}%`;
    document.getElementById('bar-suspicion').style.width = `${state.stats.suspicion}%`;
  }

  function loadNextEvent() {
    const card = document.getElementById('event-card');
    card.classList.add('card-hidden');

    setTimeout(() => {
      const ev = eventsDB[Math.floor(Math.random() * eventsDB.length)];
      document.getElementById('speaker-icon').innerText = ev.icon;
      document.getElementById('speaker-name').innerText = ev.speaker;
      document.getElementById('event-title').innerText = ev.title;
      document.getElementById('event-desc').innerText = ev.text;

      const box = document.getElementById('choices-box');
      box.innerHTML = '';

      ev.choices.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        const locked = (ch.reqGold && state.gold < ch.reqGold) || (ch.reqIntel && state.intel < ch.reqIntel);
        btn.disabled = locked;
        btn.innerHTML = `<span>${ch.text}</span><span class="choice-hint">${ch.hint}</span>`;

        btn.onmouseenter = () => previewOutcome(ch.outcomes, true);
        btn.onmouseleave = () => previewOutcome(ch.outcomes, false);
        btn.onclick = () => selectChoice(ch.outcomes);
        box.appendChild(btn);
      });

      card.classList.remove('card-hidden');
    }, 240);
  }

  function previewOutcome(outcomes, active) {
    ['king', 'church', 'nobility', 'suspicion'].forEach(key => {
      const bg = document.getElementById(`bg-${key}`);
      bg.classList.remove('pulse-up', 'pulse-down');
      if (active && outcomes[key]) {
        bg.classList.add(outcomes[key] > 0 ? 'pulse-up' : 'pulse-down');
      }
    });
  }

  function selectChoice(outcomes) {
    previewOutcome(outcomes, false);
    if (outcomes.gold && outcomes.gold > 0) playSound('coin');
    else playSound('click');

    if (navigator.vibrate) navigator.vibrate(35);

    state.gold += outcomes.gold || 0;
    state.intel += outcomes.intel || 0;
    ['king', 'church', 'nobility', 'suspicion'].forEach(k => {
      if (outcomes[k]) state.stats[k] = Math.max(0, Math.min(100, state.stats[k] + outcomes[k]));
    });

    state.turn++;
    checkRankProgression();
    saveGame();
    updateUI();

    if (!checkGameOver()) loadNextEvent();
  }

  function triggerVictory() {
    playSound('fanfare');
    localStorage.removeItem(STORAGE_KEY);
    closeSpyModal();
    document.getElementById('speaker-icon').innerText = "👑";
    document.getElementById('speaker-name').innerText = "ZWYCIĘSTWO! NOWY MONARCHA";
    document.getElementById('event-title').innerText = `Zdobyłeś tron w rundzie ${state.turn}`;
    document.getElementById('event-desc').innerText =
      "Po miesiącach knucia w cieniach pałacu obaliłeś słabego władcę. Gwardia, Kościół i baronowie klękają przed Twoim majestatem!";

    const box = document.getElementById('choices-box');
    box.innerHTML = `<button class="choice-btn" onclick="resetGame()">👑 Rozpocznij nowe panowanie</button>`;
  }

  function checkGameOver() {
    let reason = "";
    if (state.stats.suspicion >= 100) reason = "Twoja siatka spiskowa została zdemaskowana. Straż królewska wtrąciła cię do lochu!";
    else if (state.stats.king <= 0) reason = "Król utracił do ciebie resztki zaufania i podpisał wyrok wygnania.";
    else if (state.stats.church <= 0) reason = "Trybunał Inkwizycji obłożył cię klątwą ekskomuniki.";
    else if (state.stats.nobility <= 0) reason = "Zbuntowani baronowie wtargnęli do pałacu i obalili twoje rządy.";

    if (reason) {
      playSound('gameover');
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('speaker-icon').innerText = "💀";
      document.getElementById('speaker-name').innerText = "KONIEC GRY";
      document.getElementById('event-title').innerText = `Przetrwałeś rund: ${state.turn} (${courtRanks[state.rankIndex].title})`;
      document.getElementById('event-desc').innerText = reason;

      const box = document.getElementById('choices-box');
      box.innerHTML = `<button class="choice-btn" onclick="resetGame()">🔄 Zacznij nową intrygę</button>`;
      return true;
    }
    return false;
  }

  // --- 5. LOGIKA MODALA SZPIEGÓW I WIELKIEGO SPISKU ---
  function openSpyModal() {
    playSound('click');
    document.getElementById('spy-modal').classList.add('open');
    renderModalTab();
  }

  function closeSpyModal() {
    playSound('click');
    document.getElementById('spy-modal').classList.remove('open');
  }

  function switchTab(tab) {
    playSound('click');
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    renderModalTab();
  }

  function renderModalTab() {
    const body = document.getElementById('modal-body');
    body.innerHTML = '';

    if (currentTab === 'spies') {
      body.innerHTML += `
        <div class="spy-card">
          <div>
            <h4>Zwerbuj Nowego Szpiega</h4>
            <p>Zwiększa możliwości operacyjne w zamku. Koszt: 75 Złota.</p>
          </div>
          <button class="choice-btn" ${state.gold < 75 || state.spies >= state.maxSpies ? 'disabled' : ''} onclick="recruitSpy()">Zwerbuj (-75g)</button>
        </div>
        <div class="spy-card">
          <div>
            <h4>Infiltracja Archiwum</h4>
            <p>Szpieg wykrada tajną korespondencję (+1 Hak 📜, +8 Spisek).</p>
          </div>
          <button class="choice-btn" ${state.gold < 25 || state.spies <= 0 ? 'disabled' : ''} onclick="gatherIntel()">Wyślij agenta (-25g)</button>
        </div>`;
    } else if (currentTab === 'market') {
      body.innerHTML += `
        <div class="spy-card">
          <div>
            <h4>Wywar z Tojadu (Trucizna)</h4>
            <p>Zwiększa szansę udanego zamachu o 30%. Posiadasz: ${state.tojad}</p>
          </div>
          <button class="choice-btn" ${state.gold < 60 ? 'disabled' : ''} onclick="buyPoison()">Kup truciznę (-60g)</button>
        </div>
        <div class="spy-card">
          <div>
            <h4>Przekupstwo Strażników</h4>
            <p>Zatarcie śladów w śledztwie (-20 Spisek).</p>
          </div>
          <button class="choice-btn" ${state.gold < 50 || state.stats.suspicion <= 0 ? 'disabled' : ''} onclick="bribeGuards()">Opłać milczenie (-50g)</button>
        </div>`;
    } else if (currentTab === 'assassinations') {
      if (state.targets.length === 0) {
        body.innerHTML = `<p style="text-align:center; padding:20px; grid-column: 1/-1;">Wszyscy główni rywale zostali wyeliminowani.</p>`;
      }
      state.targets.forEach((t, idx) => {
        const chance = Math.min(95, Math.round((t.baseChance + (state.tojad > 0 ? 0.3 : 0)) * 100));
        body.innerHTML += `
          <div class="spy-card">
            <div>
              <h4>Cel: ${t.name}</h4>
              <p>Ochrona: ${t.guard} | Szansa sukcesu: <b>${chance}%</b> ${state.tojad > 0 ? '(+Tojad)' : ''}</p>
            </div>
            <button class="choice-btn" ${state.gold < 90 || state.spies <= 0 ? 'disabled' : ''} onclick="assassinate(${idx}, ${chance})">Zleć zabójstwo (-90g)</button>
          </div>`;
      });
    } else if (currentTab === 'crown') {
      if (state.plotStage >= crownPlotStages.length) {
        body.innerHTML = `<p style="text-align:center; padding:20px; grid-column: 1/-1;">Korona należy już do Ciebie!</p>`;
      } else {
        const st = crownPlotStages[state.plotStage];
        const canAfford = state.gold >= st.costGold && state.intel >= st.costIntel;
        body.innerHTML += `
          <div class="spy-card plot-card">
            <div>
              <h4>${st.name}</h4>
              <p>${st.desc}</p>
              <p style="color:var(--gold); margin-top:6px;">Wymogi: ${st.costGold} Złota, ${st.costIntel} Haki 📜 | Ryzyko: +${st.suspicionGain} Spisek</p>
            </div>
            <button class="choice-btn" ${!canAfford ? 'disabled' : ''} onclick="advanceCrownPlot()">
              👑 Zrealizuj etap spisku (-${st.costGold}g, -${st.costIntel} 📜)
            </button>
          </div>`;
      }
    }

    document.getElementById('modal-status').innerText =
      `Złoto: ${state.gold} | Haki: ${state.intel} | Szpiedzy: ${state.spies}/${state.maxSpies} | Tojad: ${state.tojad}`;
  }

  function advanceCrownPlot() {
    const st = crownPlotStages[state.plotStage];
    state.gold -= st.costGold;
    state.intel -= st.costIntel;
    state.stats.suspicion = Math.min(100, state.stats.suspicion + st.suspicionGain);
    state.plotStage++;

    saveGame();
    updateUI();

    if (checkGameOver()) {
      closeSpyModal();
      return;
    }

    if (state.plotStage >= crownPlotStages.length) {
      triggerVictory();
    } else {
      playSound('fanfare');
      showToast(`Ukończono etap ${state.plotStage}/4 Wielkiego Spisku!`);
      renderModalTab();
    }
  }

  function recruitSpy() {
    playSound('coin');
    state.gold -= 75; state.spies++;
    saveGame(); updateUI(); renderModalTab();
    showToast("Zwerbowano nowego szpiega!");
  }

  function gatherIntel() {
    playSound('click');
    state.gold -= 25; state.intel++;
    state.stats.suspicion = Math.min(100, state.stats.suspicion + 8);
    saveGame(); updateUI(); renderModalTab();
    showToast("Zdobyto nowy Hak (+1 📜)");
    if (checkGameOver()) closeSpyModal();
  }

  function buyPoison() {
    playSound('coin');
    state.gold -= 60; state.tojad++;
    saveGame(); updateUI(); renderModalTab();
    showToast("Zakupiono Wywar z Tojadu!");
  }

  function bribeGuards() {
    playSound('coin');
    state.gold -= 50;
    state.stats.suspicion = Math.max(0, state.stats.suspicion - 20);
    saveGame(); updateUI(); renderModalTab();
    showToast("Strażnicy przekupieni (-20 Spisek)");
  }

  function assassinate(index, chance) {
    playSound('dagger');
    const target = state.targets[index];
    state.gold -= 90;
    if (state.tojad > 0) state.tojad--;

    if (Math.random() * 100 <= chance) {
      showToast(`Zamach udany! ${target.name} nie żyje (+1 📜).`);
      state.intel++;
      state.stats.suspicion = Math.min(100, state.stats.suspicion + 12);
      state.targets.splice(index, 1);
    } else {
      showToast(`Wpadka! Twój szpieg został pojmany!`);
      state.spies = Math.max(0, state.spies - 1);
      state.stats.suspicion = Math.min(100, state.stats.suspicion + target.risk);
    }
    saveGame(); updateUI(); renderModalTab();
    if (checkGameOver()) closeSpyModal();
  }

  // Start gry
  initParticles();
  animateCanvas();
  updateUI();
  loadNextEvent();
</script>
</body>
</html>
