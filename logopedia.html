<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logopedyczna Akademia Dźwięków</title>
  <style>
    :root {
      --bg: #f0f7ff;
      --card: #ffffff;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --error: #ef4444;
      --accent: #f59e0b;
      --text: #1e293b;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0; padding: 20px;
      background-color: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    header {
      text-align: center; margin-bottom: 15px; width: 100%; max-width: 800px;
    }
    h1 { margin: 0 0 10px 0; font-size: 1.8rem; color: #1e3a8a; }
    .score-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); padding: 10px 20px; border-radius: 14px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px;
      font-weight: bold; font-size: 1.1rem;
    }
    .tabs {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;
    }
    .tab-btn {
      padding: 12px 22px; border: none; border-radius: 12px;
      background: #dbeafe; color: #1e40af; font-size: 1.05rem; font-weight: bold;
      cursor: pointer; transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--primary); color: white; transform: scale(1.04);
      box-shadow: 0 4px 10px rgba(59,130,246,0.3);
    }
    .game-card {
      background: var(--card); width: 100%; max-width: 800px;
      border-radius: 20px; padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center; position: relative;
    }
    .emoji-display {
      font-size: 5.5rem; margin: 10px 0; user-select: none;
    }
    .word-prompt {
      font-size: 1.6rem; font-weight: bold; margin: 10px 0;
    }
    .phonetic-hint {
      display: inline-block; background: #fef3c7; color: #92400e;
      padding: 6px 14px; border-radius: 8px; font-size: 0.95rem;
      margin-bottom: 20px; border: 1px dashed #f59e0b;
    }
    .speak-btn {
      background: var(--accent); color: white; border: none;
      padding: 10px 20px; border-radius: 50px; font-size: 1rem;
      font-weight: bold; cursor: pointer; margin-bottom: 20px;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .speak-btn:hover { filter: brightness(0.95); }
    .options-grid {
      display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 15px;
    }
    .option-btn {
      padding: 16px 28px; font-size: 1.25rem; font-weight: bold;
      border: 3px solid #cbd5e1; border-radius: 16px;
      background: #f8fafc; color: var(--text); cursor: pointer;
      transition: all 0.2s; min-width: 150px;
    }
    .option-btn:hover {
      border-color: var(--primary); background: #eff6ff;
    }
    .syllable-slot {
      min-height: 65px; border: 3px dashed #94a3b8; border-radius: 16px;
      display: flex; justify-content: center; align-items: center;
      gap: 10px; padding: 10px; margin: 15px auto; max-width: 500px;
      background: #f8fafc; font-size: 1.5rem; font-weight: bold;
    }
    .syllable-chip {
      background: var(--primary); color: white; padding: 10px 20px;
      border-radius: 12px; cursor: pointer; user-select: none;
    }
    .feedback {
      margin-top: 20px; font-size: 1.3rem; font-weight: bold; min-height: 36px;
    }
    .therapist-panel {
      margin-top: 20px; width: 100%; max-width: 800px;
      background: #e2e8f0; padding: 12px 20px; border-radius: 12px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.95rem;
    }
    .home-link {
      display: inline-flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid #93c5fd;
      border-radius: 10px;
      background: #dbeafe;
      color: #1e40af;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .home-link:hover { background: #bfdbfe; transform: translateY(-1px); }
    .home-link:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>🗣️ Logopedyczna Akademia Dźwięków</h1>
    <div class="score-bar">
      <span>⭐ Gwiazdki: <span id="score">0</span></span>
      <span id="mode-title">Tryb: Detektyw Głosek</span>
      <button onclick="resetTask()" style="padding:6px 12px; border-radius:8px; border:none; cursor:pointer; background:#cbd5e1; font-weight:bold;">Następne słowo ➡️</button>
      <a class="home-link" href="./index.htm" aria-label="Back to home" title="Back to home">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      </a>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchMode('gloski', this)">🚂 1. Głoski (Miejsce)</button>
      <button class="tab-btn" onclick="switchMode('sylaby', this)">🧩 2. Sylaby (Synteza)</button>
      <button class="tab-btn" onclick="switchMode('fonetyka', this)">👂 3. Fonetyka (Słuch)</button>
    </div>
  </header>

  <main class="game-card">
    <div id="emoji" class="emoji-display">🧣</div>
    <button class="speak-btn" onclick="speakCurrentWord()">🔊 Wymów słowo</button>
    <div id="prompt" class="word-prompt">Gdzie słyszysz głoskę [SZ]?</div>
    <div id="phonetic-info" class="phonetic-hint">Zapis fonetyczny: [sz-a-l-i-k] | 5 głosek</div>

    <!-- Obszar interakcji zależny od trybu -->
    <div id="interaction-area"></div>

    <div id="feedback" class="feedback"></div>
  </main>

  <div class="therapist-panel">
    <label>
      <input type="checkbox" id="toggle-hints" checked onchange="toggleTherapistHints()">
      👁️ Pokazuj podpowiedzi fonetyczne dla Logopedy (zapis i cechy głosek)
    </label>
    <span>Wskazówka: Niech dziecko powtórzy słowo 3 razy po ułożeniu!</span>
  </div>

  <script>
    const database = {
      gloski: [
        { word: "Szalik", emoji: "🧣", target: "SZ", pos: "Nagłos (Początek)", phonetic: "[sz-a-l-i-k] (5 głosek, 6 liter)" },
        { word: "Koszula", emoji: "👕", target: "SZ", pos: "Śródgłos (Środek)", phonetic: "[k-o-sz-u-l-a] (6 głosek, 7 liter)" },
        { word: "Mysz", emoji: "🐭", target: "SZ", pos: "Wygłos (Koniec)", phonetic: "[m-y-sz] (3 głoski, 4 litery)" },
        { word: "Rower", emoji: "🚲", target: "R", pos: "Nagłos i Wygłos", phonetic: "[r-o-w-e-r] (5 głosek - R na początku i końcu)" },
        { word: "Korona", emoji: "👑", target: "R", pos: "Śródgłos (Środek)", phonetic: "[k-o-r-o-n-a] (6 głosek)" },
        { word: "Zamek", emoji: "🏰", target: "Z", pos: "Nagłos (Początek)", phonetic: "[z-a-m-e-k] (5 głosek)" },
        { word: "Koza", emoji: "🐐", target: "Z", pos: "Śródgłos (Środek)", phonetic: "[k-o-z-a] (4 głoski)" },
        { word: "Pies", emoji: "🐕", target: "S", pos: "Wygłos (Koniec)", phonetic: "[p'-e-s] (3 głoski, 4 litery - 'i' zmiękcza 'p')" }
      ],
      sylaby: [
        { word: "Samolot", emoji: "✈️", syllables: ["SA", "MO", "LOT"], phonetic: "3 sylaby otwarte/zamknięte: SA-MO-LOT" },
        { word: "Żyrafa", emoji: "🦒", syllables: ["ŻY", "RA", "FA"], phonetic: "3 sylaby otwarte: ŻY-RA-FA" },
        { word: "Czekolada", emoji: "🍫", syllables: ["CZE", "KO", "LA", "DA"], phonetic: "4 sylaby otwarte: CZE-KO-LA-DA" },
        { word: "Balony", emoji: "🎈", syllables: ["BA", "LO", "NY"], phonetic: "3 sylaby otwarte: BA-LO-NY" },
        { word: "Pomidor", emoji: "🍅", syllables: ["PO", "MI", "DOR"], phonetic: "3 sylaby: PO-MI-DOR" },
        { word: "Lokomotywa", emoji: "🚂", syllables: ["LO", "KO", "MO", "TY", "WA"], phonetic: "5 sylab otwartych: LO-KO-MO-TY-WA" }
      ],
      fonetyka: [
        {
          word: "Koza", emoji: "🐐",
          question: "Jaka jest głoska [Z] w słowie KOZA (w opozycji do KOSA)?",
          answer: "Dźwięczna 🐝 (drży krtań)",
          options: ["Dźwięczna 🐝 (drży krtań)", "Bezdźwięczna 🐍 (bez drgań)"],
          phonetic: "Opozycja: KOZA [z - dźwięczna] vs KOSA [s - bezdźwięczna]"
        },
        {
          word: "Półka", emoji: "📚",
          question: "Jaka jest głoska [P] na początku słowa PÓŁKA (w opozycji do BUŁKA)?",
          answer: "Bezdźwięczna 🐍 (bez drgań)",
          options: ["Dźwięczna 🐝 (drży krtań)", "Bezdźwięczna 🐍 (bez drgań)"],
          phonetic: "Opozycja: PÓŁKA [p - bezdźwięczna] vs BUŁKA [b - dźwięczna]"
        },
        {
          word: "Szafa", emoji: "🚪",
          question: "Do jakiego szeregu należy głoska [SZ] w słowie SZAFA?",
          answer: "Szereg szumiący (SZ, Ż, CZ, DŻ)",
          options: ["Szereg szumiący (SZ, Ż, CZ, DŻ)", "Szereg syczący (S, Z, C, DZ)", "Szereg ciszący (Ś, Ź, Ć, DŹ)"],
          phonetic: "Głoska przedniojęzykowo-dziąsłowa (czubek języka u góry za wałkiem dziąsłowym)"
        },
        {
          word: "Sowa", emoji: "🦉",
          question: "Do jakiego szeregu należy głoska [S] w słowie SOWA?",
          answer: "Szereg syczący (S, Z, C, DZ)",
          options: ["Szereg szumiący (SZ, Ż, CZ, DŻ)", "Szereg syczący (S, Z, C, DZ)", "Szereg ciszący (Ś, Ź, Ć, DŹ)"],
          phonetic: "Głoska przedniojęzykowo-zębowa (czubek języka za dolnymi zębami)"
        },
        {
          word: "Ślimak", emoji: "🐌",
          question: "Do jakiego szeregu należy głoska [Ś] w słowie ŚLIMAK?",
          answer: "Szereg ciszący (Ś, Ź, Ć, DŹ)",
          options: ["Szereg szumiący (SZ, Ż, CZ, DŻ)", "Szereg syczący (S, Z, C, DZ)", "Szereg ciszący (Ś, Ź, Ć, DŹ)"],
          phonetic: "Głoska środkowojęzykowa (środek języka uniesiony do podniebienia twardego)"
        }
      ]
    };

    let currentMode = 'gloski';
    let currentIndex = 0;
    let score = 0;
    let selectedSyllables = [];

    function switchMode(mode, btnElement) {
      currentMode = mode;
      currentIndex = 0;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      const titles = {
        gloski: "Tryb: Detektyw Głosek (Nagłos / Śródgłos / Wygłos)",
        sylaby: "Tryb: Budowniczy Słów (Synteza sylabowa)",
        fonetyka: "Tryb: Fonetyczne Ucho (Słuch fonemowy)"
      };
      document.getElementById('mode-title').innerText = titles[mode];
      loadTask();
    }

    function loadTask() {
      const feedback = document.getElementById('feedback');
      feedback.innerText = "";
      const area = document.getElementById('interaction-area');
      area.innerHTML = "";

      const list = database[currentMode];
      const item = list[currentIndex % list.length];

      document.getElementById('emoji').innerText = item.emoji;
      document.getElementById('phonetic-info').innerText = item.phonetic;

      if (currentMode === 'gloski') {
        document.getElementById('prompt').innerText = `Słowo: ${item.word.toUpperCase()} — gdzie ukryła się głoska [${item.target}]?`;
        const positions = ["Nagłos (Początek)", "Śródgłos (Środek)", "Wygłos (Koniec)", "Nagłos i Wygłos"];
        const grid = document.createElement('div');
        grid.className = 'options-grid';

        positions.forEach(pos => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = pos;
          btn.onclick = () => checkAnswer(pos === item.pos);
          grid.appendChild(btn);
        });
        area.appendChild(grid);

      } else if (currentMode === 'sylaby') {
        selectedSyllables = [];
        document.getElementById('prompt').innerText = `Ułóż słowo z sylab (liczba sylab: ${item.syllables.length}):`;

        const slot = document.createElement('div');
        slot.className = 'syllable-slot';
        slot.id = 'syllable-target';
        slot.innerText = "Klikaj sylaby poniżej...";
        area.appendChild(slot);

        const shuffled = [...item.syllables].sort(() => Math.random() - 0.5);
        const grid = document.createElement('div');
        grid.className = 'options-grid';

        shuffled.forEach((syl) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = syl;
          btn.onclick = () => addSyllable(syl, btn, item.syllables);
          grid.appendChild(btn);
        });
        area.appendChild(grid);

      } else if (currentMode === 'fonetyka') {
        document.getElementById('prompt').innerText = item.question;
        const grid = document.createElement('div');
        grid.className = 'options-grid';

        item.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = () => checkAnswer(opt === item.answer);
          grid.appendChild(btn);
        });
        area.appendChild(grid);
      }
    }

    function addSyllable(syl, btn, correctSyllables) {
      selectedSyllables.push(syl);
      btn.disabled = true;
      btn.style.opacity = "0.4";

      const slot = document.getElementById('syllable-target');
      slot.innerHTML = "";
      selectedSyllables.forEach(s => {
        const chip = document.createElement('span');
        chip.className = 'syllable-chip';
        chip.innerText = s;
        slot.appendChild(chip);
      });

      speakText(syl.toLowerCase());

      if (selectedSyllables.length === correctSyllables.length) {
        const isCorrect = selectedSyllables.join('') === correctSyllables.join('');
        checkAnswer(isCorrect);
        if (!isCorrect) {
          setTimeout(() => loadTask(), 1400);
        }
      }
    }

    function checkAnswer(isCorrect) {
      const feedback = document.getElementById('feedback');
      if (isCorrect) {
        score++;
        document.getElementById('score').innerText = score;
        feedback.style.color = "var(--success)";
        feedback.innerText = "🎉 Brawo! Świetna odpowiedź! Powtórz słowo głośno i wyraźnie.";
        speakCurrentWord();
      } else {
        feedback.style.color = "var(--error)";
        feedback.innerText = "🤔 Posłuchaj jeszcze raz uważnie i spróbuj ponownie!";
      }
    }

    function resetTask() {
      currentIndex++;
      loadTask();
    }

    function toggleTherapistHints() {
      const show = document.getElementById('toggle-hints').checked;
      document.getElementById('phonetic-info').style.display = show ? 'inline-block' : 'none';
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pl-PL';
        utterance.rate = 0.85; // Nieco wolniejsze, wyraźne tempo logopedyczne
        window.speechSynthesis.speak(utterance);
      }
    }

    function speakCurrentWord() {
      const list = database[currentMode];
      const item = list[currentIndex % list.length];
      speakText(item.word);
    }

    window.onload = loadTask;
  </script>
</body>
</html>
